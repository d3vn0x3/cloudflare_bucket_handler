name: Build & Release .exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0). If left empty, v-manual-<run_number> is used"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v-manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .exe with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name "CloudflareR2Manager" --collect-all customtkinter --hidden-import pystray --hidden-import PIL --hidden-import watchdog --hidden-import dotenv --hidden-import boto3 --hidden-import cv2 main.py

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release_assets
          cp "dist/CloudflareR2Manager.exe" "release_assets/CloudflareR2Manager-${{ steps.version.outputs.tag }}.exe"
          cp .env.example release_assets/env.example.txt
          ls -la release_assets/

      - name: Create GitHub Release with .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cloudflare R2 Sync Hub ${{ steps.version.outputs.tag }}"
          body: |
            ## ⬇️ Direct download (Windows)

            1. Download `CloudflareR2Manager-${{ steps.version.outputs.tag }}.exe`
            2. Place it in a folder, e.g. `C:\R2Manager\`
            3. Create your `.env` file next to it (use the attached `env.example.txt` as a template, rename it to `.env`)
            4. Double-click and done — it stays in the system tray.

            > If SmartScreen warns you: *More info → Run anyway*.

            ---

            ### Changes
            See commits since the previous tag in the code tab.
          files: |
            release_assets/CloudflareR2Manager-${{ steps.version.outputs.tag }}.exe
            release_assets/env.example.txt
          draft: false
          prerelease: false
